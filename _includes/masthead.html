{% include base_path %}
<header class="masthead">
  <div class="masthead__inner-wrap">
    <a class="site-name" href="{{ base_path }}/">{{ site.title }}</a>
    <nav class="simple-nav" aria-label="Main navigation">
      {% for link in site.data.navigation.main %}
        {% if link.url contains 'http' %}
          {% assign domain = '' %}
        {% else %}
          {% assign domain = base_path %}
        {% endif %}
        <a href="{{ domain }}{{ link.url }}"{% if page.url == link.url or page.url contains link.url and link.url != '/' %} aria-current="page"{% endif %}>{{ link.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
